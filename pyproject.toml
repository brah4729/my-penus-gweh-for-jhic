[project]
name = "my-penus-gweh"
version = "0.1.0"
description = "RAG-augmented school assistant for SMK Plus Pelita Nusantara"
readme = "README.md"
requires-python = ">=3.11"
# Base deps = API server only (what the Docker image installs via `uv sync --no-dev`).
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ruff>=0.16.8",
]
# Local only: `uv sync --all-groups` (or --group train / --group scrape).
train = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "huggingface-hub>=1.32.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "peft>=0.21.0",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "trl>=1.13.0",
    "unsloth>=2024.8",
    "wandb>=0.30.0",
]
scrape = [
    "beautifulsoup4>=4.15.0",
    "scrapy>=2.19.0",
]
